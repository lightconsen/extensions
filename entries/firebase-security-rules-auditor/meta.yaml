i18n:
  zh:
    name: firebase-security-rules-auditor
    description: "审计 Firebase（Firestore、Cloud Storage）安全规则，检查漏洞、权限提升、角色绕过、create 与 update 不一致、资源耗尽、类型安全、大小限制以及 hasOnly 所有权检查。在审计/审查规则、运行红队规则评估或根据审计员检查表评分时使用。请勿用于 Firebase CLI（登录、部署）、Auth、Crashlytics、Remote Config 或数据库查询。"

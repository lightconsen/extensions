  repo: https://github.com/microsoft/skills
  commit: 02e0b2f852b39ea00c43283f999b83fc12079273
  paths:
    - .github/plugins/azure-skills/skills/azure-deploy
i18n:
  zh:
    name: azure-deploy
    description: "为已准备好且具有现有 .azure/deployment-plan.md 和基础设施文件的应用程序执行 Azure 部署。当用户要求创建新应用程序时，请勿使用此技能——请改用 azure-prepare。此技能运行 azd up、azd deploy、terraform apply 和 az deployment 命令，并具有内置错误恢复能力。需要来自 azure-prepare 的 .azure/deployment-plan.md 以及来自 azure-validate 的验证状态。适用场景：\"run azd up\"、\"run azd deploy\"、\"execute deployment\"、\"push to production\"、\"push to cloud\"、\"go live\"、\"ship it\"、\"bicep deploy\"、\"terraform apply\"、\"publish to Azure\"、\"launch on Azure\"。不适用场景：\"create and deploy\"、\"build and deploy\"、\"create a new app\"、\"set up infrastructure\"、\"create and deploy to Azure using Terraform\"——这些请使用 azure-prepare。"

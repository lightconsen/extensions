i18n:
  zh:
    name: "发布前代码评审"
    description: "对自上次部署或指定提交以来的所有变更进行全面的发布前评审。检查正确性、原子性和竞态条件、错误处理、数据存储卫生、安全性、类型安全、测试、集成、性能和可观测性。在每个 sprint 之后以及部署之前使用。最终给出 SHIP / SHIP WITH FIXES / DO NOT SHIP 的判断。"

    description: "创建结构化的事件响应手册，包含分步流程、升级路径和恢复操作。此技能适用于：为支付处理系统构建服务中断手册；创建覆盖连接池耗尽、复制延迟和磁盘空间警报的数据库事件流程；让新值班工程师熟悉为凌晨 3 点大脑编写的逐步恢复指南；或在多个工程团队间标准化升级矩阵。"

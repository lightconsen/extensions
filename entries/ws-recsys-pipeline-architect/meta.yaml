i18n:
  zh:
    name: "推荐系统流水线架构"
    description: "使用由 xAI 开源的 X For You 算法推广的六阶段框架 Source→Hydrator→Filter→Scorer→Selector→SideEffect，设计可组合的推荐、排序和信息流流水线。在构建任何为（用户，上下文）挑选“前 K 个条目”的系统时使用——内容信息流、搜索排序、RAG 重排序器、任务优先级排序、通知分类、广告选择。"

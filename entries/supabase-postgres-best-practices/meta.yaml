i18n:
  zh:
    name: supabase-postgres-best-practices
    description: "由 Supabase 维护的 Postgres 最佳实践，适用于任何位置运行的 Postgres。在编写或更改任何存在于 Postgres 数据库中的内容之前，请加载此技能：创建或修改表和列（包括选择列类型）、模式设计、迁移和声明式模式文件、RLS 策略及其验证测试、索引、触发器、数据库函数、队列和计划任务（pg_cron、pgmq）、向量/语义搜索（pgvector），以及恢复转储（pg_restore）或导入数据。在诊断慢查询、高 CPU、超时、EXPLAIN 计划、连接耗尽、锁定、膨胀，或行对错误用户或租户可见时，也应加载此技能。这不仅是一份性能指南——模式、迁移、安全和 SQL 编写任务也需要这些规则，即使只改动一列或执行单条查询也不例外。"

i18n:
  zh:
    name: doc-coauthoring
    description: "引导用户通过结构化工作流共同编写文档。当用户想要编写文档、提案、技术规格、决策文档或类似的结构化内容时使用。该工作流帮助用户高效传递上下文、通过迭代完善内容，并验证文档对读者有效。当用户提到编写文档、创建提案、起草规格或类似的文档任务时触发。"

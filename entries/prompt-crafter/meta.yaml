    name: "提示词创作者"
    description: "批量提示词编写代理。当需要一次性编写多个不同提示词时委派到这里——用于并行图像生成（如\"5 个 logo 方案\"）、串行转并行工作流（如先生成 logo 再应用到马克杯/T恤/海报），或任何需要同时撰写 2 条以上提示词的任务。"

i18n:
  zh:
    name: "KPI 仪表盘设计"
    description: "通过指标选择、可视化最佳实践和实时监控模式设计高效的 KPI 仪表盘。此技能适用于：构建跟踪 MRR、流失率及 LTV/CAC 比率的高管 SaaS 指标仪表盘；设计集实时服务健康与请求吞吐量于一体的运维中心；为产品团队创建同期群留存分析视图；或调试因计算方法不一致而导致指标互相矛盾的仪表盘。"

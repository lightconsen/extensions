    - plugins/brand-landingpage/skills/brand-landingpage
i18n:
  zh:
    name: "品牌落地页"
    description: "品牌优先的落地页设计师——先进行品牌识别访谈（色彩、字体、形状语言），然后通过 Stitch 生成并迭代出可部署的精致落地页 HTML。当用户要求创建、设计或构建落地页/主页/营销页且尚无既定视觉方向时使用；若已有设计稿、需要仪表盘或应用 UI、在组件层面工作、构建多页应用，或用既定设计令牌改版，则跳过——改用 frontend-design。"

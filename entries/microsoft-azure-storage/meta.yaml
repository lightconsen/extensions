    name: azure-storage
    description: "Azure 存储服务，包括 Blob 存储、文件共享、队列存储、表存储和 Data Lake。解答有关存储访问层（hot、cool、cold、archive）、何时使用各层以及各层比较的问题。提供对象存储、SMB 文件共享、异步消息传递、NoSQL 键值和大数据分析。包含生命周期管理。用途：blob 存储、文件共享、队列存储、表存储、data lake、上传文件、下载 blob、存储帐户、访问层、存储层、hot cool cold archive、存储层比较、何时使用存储层、生命周期管理、Azure 存储概念。不适用于：SQL 数据库、Cosmos DB（使用 azure-prepare）、使用事件中心或服务总线的消息传递（使用 azure-messaging）。"

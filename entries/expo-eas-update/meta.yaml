    description: "EAS服务（付费）。使用expo-updates和EAS CLI配置并使用EAS Update，用于JavaScript和资源的无线（OTA）更新。适用于以下场景：设置OTA更新、运行eas update:configure或eas update、发布到预览/暂存/生产渠道、解释分支/渠道/运行时版本、测试更新，或调试已安装的构建仍显示旧代码的原因。当TestFlight、预览或生产环境的更新未出现时（包括冷启动或重新打开应用的问题）使用。不用于更新健康指标；如需监控采用率、崩溃和灰度发布，请使用eas-update-insights。"

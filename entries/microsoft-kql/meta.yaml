    name: kql
    description: "KQL 语言专业知识，用于编写正确、高效的 Kusto 查询语言查询。涵盖语法陷阱、联接模式、动态类型、日期时间陷阱、正则表达式模式、序列化、内存管理、结果大小控制，以及高级函数（geo、vector、graph）。在编写、调试或审查 KQL 查询时（即使是简单查询），请使用此技能，因为陷阱部分可防止最常见的错误，这些错误会浪费工具调用并导致昂贵的重试级联。触发条件：KQL、Kusto、ADX、Azure Data Explorer、Fabric Real-Time Intelligence、EventHouse、Log Analytics、日志分析、数据探索、时间序列、异常检测、summarize、where 子句、join、extend、project、let 语句、parse 运算符、extract 函数，以及任何提及管道转发查询语法的内容。"

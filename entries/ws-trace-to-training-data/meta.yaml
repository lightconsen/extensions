    description: "将评估追踪记录和生产日志转换为 SFT 示例和偏好对。当存在已评分的追踪记录或失败样例并需要将其变成训练数据、对模型输出应用拒绝采样，或从通过和失败的运行中构建 DPO 对时使用。"
